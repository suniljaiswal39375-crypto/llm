# ~1B Dense Transformer (Gemma 3/4 5:1 SWA + Sandwich Norm + QK-Norm + YaRN-ready RoPE)
vocab_size: 65536
d_model: 2048
n_layers: 18
n_heads: 16
n_kv_heads: 4
max_seq_len: 8192
attention_type: gqa
qk_norm: true
sliding_window: 1024
swa_ratio: 5
rope_theta: 1000000.0
norm_type: rmsnorm
sandwich_norm: true
tie_word_embeddings: false
z_loss_weight: 0.0001
mtp_depth: 1
