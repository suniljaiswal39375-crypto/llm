# DeepSeek-V3/V4 style Fine-Grained Sparse MoE + Shared Expert + Auxiliary-Loss-Free + MLA
vocab_size: 32000
d_model: 512
n_layers: 8
n_heads: 8
n_kv_heads: 8
max_seq_len: 4096
attention_type: mla
mla_q_lora_rank: 128
mla_kv_lora_rank: 96
mla_qk_nope_head_dim: 32
mla_qk_rope_head_dim: 32
mla_v_head_dim: 64
use_moe: true
moe_first_k_dense: 1
moe_layer_stride: 1
n_routed_experts: 8
moe_top_k: 2
n_shared_experts: 1
moe_aux_free_gamma: 0.001
z_loss_weight: 0.0001
mtp_depth: 1
