# Fast CPU / single-GPU smoke-test preset (~1.2M params)
vocab_size: 1024
d_model: 128
n_layers: 4
n_heads: 4
n_kv_heads: 2
max_seq_len: 256
attention_type: gqa
qk_norm: true
rope_theta: 500000.0
norm_type: rmsnorm
sandwich_norm: true
tie_word_embeddings: true
z_loss_weight: 0.0001
mtp_depth: 1
mtp_loss_weight: 0.3
